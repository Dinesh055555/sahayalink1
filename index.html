<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SahayaLink</title>
<style>
:root{
  --bg:#f4f6f8;--card:#fff;--ink:#1a2430;--muted:#5c6b7a;--line:#e2e8ee;
  --crit:#c0392b;--critbg:#fdece9;--high:#e08a1e;--highbg:#fdf4e6;
  --teal:#1f8a80;--tealbg:#e7f4f2;--accent:#2c5f8a;--accentbg:#e9f0f7;
  --asha:#6c4bb0;--cho:#2c5f8a;--gold:#c9a227;--goldbg:#fbf3d9;
}
:root[data-theme="dark"]{
  --bg:#12181f;--card:#1b232d;--ink:#e8edf2;--muted:#9aa8b6;--line:#2b3742;
  --critbg:#3a1a16;--highbg:#3a2c14;--tealbg:#123330;--accentbg:#14283a;--goldbg:#332b12;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
/* login */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#login .logo{font-size:34px;font-weight:800;margin-bottom:4px}
#login .logo span{color:var(--teal)}
#login .tag{color:var(--muted);margin-bottom:28px;max-width:320px}
#login .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;width:100%;max-width:340px}
#login input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);
  color:var(--ink);font-size:16px;margin-bottom:12px}
#login button{width:100%;padding:13px;background:var(--teal);color:#fff;border:none;border-radius:10px;
  font-size:16px;font-weight:700;cursor:pointer}
#login .err{color:var(--crit);font-size:13px;min-height:18px;margin-bottom:6px}
.demo{margin-top:18px;font-size:12px;color:var(--muted);text-align:left;background:var(--card);
  border:1px dashed var(--line);border-radius:10px;padding:12px;max-width:340px}
.demo b{color:var(--ink)} .demo code{background:var(--bg);padding:1px 5px;border-radius:4px;cursor:pointer}
/* app chrome */
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px}
.logo2{font-weight:800;font-size:18px}.logo2 span{color:var(--teal)}
.who{font-size:12px;color:var(--muted);flex:1}
.who b{color:var(--ink)}
.offline{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--teal);background:var(--tealbg);padding:3px 8px;border-radius:20px;font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--teal);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.4}}
.iconbtn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:5px 9px;cursor:pointer;font-size:13px}
nav{display:flex;gap:2px;background:var(--card);border-bottom:1px solid var(--line);padding:0 8px;overflow-x:auto;position:sticky;top:53px;z-index:19}
nav button{background:none;border:none;padding:12px 12px;font-size:13.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-weight:600}
nav button.active{color:var(--accent);border-bottom-color:var(--accent)}
main{padding:14px;max-width:900px;margin:0 auto}
.kpirow{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .n{font-size:23px;font-weight:800;line-height:1}.kpi .l{font-size:11px;color:var(--muted);margin-top:3px}
.kpi.crit .n{color:var(--crit)}.kpi.high .n{color:var(--high)}.kpi.teal .n{color:var(--teal)}.kpi.gold .n{color:var(--gold)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:13px}
.count{font-size:13px;color:var(--muted);margin-bottom:10px}
.case{background:var(--card);border:1px solid var(--line);border-left-width:4px;border-radius:12px;padding:13px;margin-bottom:10px}
.case.Critical{border-left-color:var(--crit)}.case.High{border-left-color:var(--high)}
.case.resolved{opacity:.55}.case.unreachable{border-left-color:var(--muted)}
.crow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pid{font-weight:700;font-size:15px}
.sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.badge.Critical{background:var(--critbg);color:var(--crit)}.badge.High{background:var(--highbg);color:var(--high)}
.risk{font-size:12px;color:var(--muted);text-align:right;margin-top:3px}
.action{margin-top:10px;background:var(--accentbg);color:var(--accent);border-radius:8px;padding:9px 11px;font-size:13.5px;font-weight:600}
.why{margin-top:8px;font-size:12.5px;color:var(--muted)}.why b{color:var(--ink)}
.cadre{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;margin-left:6px}
.cadre.ASHA{background:#efe9f8;color:var(--asha)}.cadre.CHO{background:var(--accentbg);color:var(--cho)}
:root[data-theme="dark"] .cadre.ASHA{background:#2a2140}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.chip{font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted)}
.statustag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
.statustag.resolved{background:var(--tealbg);color:var(--teal)}
.statustag.unreachable{background:var(--highbg);color:var(--high)}
.statustag.escalated{background:var(--critbg);color:var(--crit)}
.btnrow{display:flex;gap:8px;margin-top:11px}
.btnrow button{flex:1;padding:9px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px;border:1px solid}
.b-resolve{border-color:var(--teal);color:var(--teal);background:none}
.b-unreach{border-color:var(--high);color:var(--high);background:none}
.b-esc{border-color:var(--crit);color:var(--crit);background:none}
.bars{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.bars h3{margin:0 0 12px;font-size:15px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px}
.bar .lab{width:150px;color:var(--muted);flex-shrink:0}
.bar .track{flex:1;background:var(--bg);border-radius:6px;height:22px;overflow:hidden}
.bar .fill{height:100%;border-radius:6px;display:flex;align-items:center;padding-left:8px;color:#fff;font-size:11.5px;font-weight:700}
.tier{display:inline-block;padding:4px 12px;border-radius:20px;font-weight:800;font-size:13px}
.tier.Gold{background:var(--goldbg);color:var(--gold)}.tier.Silver{background:#eceff2;color:#7a8794}
.tier.Bronze{background:#f0e6dd;color:#a0764a}
:root[data-theme="dark"] .tier.Silver{background:#2a323b}:root[data-theme="dark"] .tier.Bronze{background:#332619}
.lead{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.lead .rk{width:26px;height:26px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.lead .rk.top{background:var(--goldbg);color:var(--gold)}
.lead .nm{flex:1;font-weight:600}.lead .bl{font-size:12px;color:var(--muted)}
.lead .pt{font-weight:800}
.me{background:var(--tealbg);border-radius:8px;padding:0 8px}
.detrow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.detrow .k{color:var(--muted)}
.gov h3{margin:0 0 8px;font-size:15px}.gov ul{margin:6px 0 0;padding-left:18px}
.gov li{margin-bottom:6px;font-size:13.5px;color:var(--muted)}.gov li b{color:var(--ink)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:11px 18px;border-radius:24px;font-weight:600;font-size:14px;opacity:0;transition:opacity .3s;z-index:60;pointer-events:none}
.toast.on{opacity:1}
.foot{text-align:center;font-size:11px;color:var(--muted);padding:20px}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.hint a{text-decoration:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.wrow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.wrow .nm{font-weight:700}.wrow .vils{font-size:11.5px;color:var(--muted);margin-top:3px;max-width:520px}
.minibtn{border:1px solid var(--accent);color:var(--accent);background:none;border-radius:8px;padding:7px 12px;font-weight:700;font-size:12.5px;cursor:pointer;white-space:nowrap}
.minibtn-solid{border:none;background:var(--accent);color:#fff;border-radius:8px;padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.rasrow,.uprow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rasrow select,.uprow input[type=file],.uprow input[type=date]{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:13px}
.rasrow select{flex:1;min-width:180px}
.okbox{margin-top:12px;background:var(--tealbg);color:var(--teal);border-radius:8px;padding:11px 13px;font-size:13px;font-weight:600}
.regionbar{background:var(--accentbg);color:var(--accent);border-radius:10px;padding:11px 14px;margin-bottom:14px;font-size:13px}
.regionbar b{font-weight:800}
.hidden{display:none}
@media(max-width:560px){.bar .lab{width:110px}}
</style>
</head>
<body>

<div id="login">
  <div class="logo">Sahaya<span>Link</span></div>
  <div class="tag">Daily follow-up worklist for ASHA &amp; CHO health workers &middot; INFINUM 2026</div>
  <div class="box">
    <div class="err" id="lerr"></div>
    <input id="uname" placeholder="Username" autocomplete="off">
    <input id="upin" placeholder="PIN" type="password" autocomplete="off">
    <button onclick="doLogin()">Log in</button>
  </div>
  <div class="demo">
    <b>Demo logins</b> (tap to fill):<br>
    ASHA worker &middot; <code onclick="fill('asha13','1234')">asha13 / 1234</code><br>
    CHO &middot; <code onclick="fill('cho3','4321')">cho3 / 4321</code><br>
    Supervisor &middot; <code onclick="fill('supervisor','0000')">supervisor / 0000</code>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="logo2">Sahaya<span>Link</span></div>
    <div class="who"><b id="hname"></b><br><span id="hrole"></span></div>
    <div class="offline"><span class="dot"></span>Offline-ready</div>
    <button class="iconbtn" onclick="toggleTheme()">&#9788;</button>
    <button class="iconbtn" onclick="logout()">Exit</button>
  </header>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<div class="toast" id="toast"></div>
<div class="foot">SahayaLink prototype &middot; synthetic data &middot; not for clinical use</div>

<script>
const API=''; // same origin
let SESS=null;

function fill(u,p){document.getElementById('uname').value=u;document.getElementById('upin').value=p;}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800);}

async function api(path,opts={}){
  opts.headers=Object.assign({'Content-Type':'application/json'},opts.headers||{});
  if(SESS)opts.headers['Authorization']='Bearer '+SESS.token;
  const r=await fetch(API+path,opts);
  if(!r.ok){const e=await r.json().catch(()=>({detail:'Error'}));throw new Error(e.detail||'Error');}
  return r.json();
}

async function doLogin(){
  const u=document.getElementById('uname').value, p=document.getElementById('upin').value;
  try{
    const res=await api('/api/login',{method:'POST',body:JSON.stringify({username:u,pin:p})});
    SESS=res;
    document.getElementById('login').style.display='none';
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('hname').textContent=res.name;
    document.getElementById('hrole').textContent=res.role+(res.block?' · '+res.block:'');
    buildNav();go(res.role==='SUPERVISOR'?'dashboard':'worklist');
  }catch(e){document.getElementById('lerr').textContent=e.message;}
}
function logout(){SESS=null;location.reload();}

const state={tab:'worklist',priority:'ALL',stage:'ALL',cases:[]};
function buildNav(){
  let tabs;
  if(SESS.role==='SUPERVISOR'){tabs=[['dashboard','Dashboard'],['regions','Regions & Workers'],['daily','Daily Handover'],['leaderboard','Leaderboard'],['gov','Governance']];}
  else if(SESS.role==='CHO'){tabs=[['worklist','My Queue'],['dashboard','Dashboard'],['rewards','Rewards'],['gov','Governance']];}
  else{tabs=[['worklist','Today\'s List'],['rewards','My Rewards'],['leaderboard','Leaderboard'],['gov','Governance']];}
  document.getElementById('nav').innerHTML=tabs.map(t=>`<button data-t="${t[0]}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
}
function go(t){state.tab=t;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.t===t));render();window.scrollTo(0,0);}

function priBadge(p){return `<span class="badge ${p}">${p}</span>`;}

async function render(){
  const m=document.getElementById('main');m.innerHTML='<div class="count">Loading…</div>';
  try{
    if(state.tab==='worklist')await renderWorklist(m);
    else if(state.tab==='rewards')await renderRewards(m);
    else if(state.tab==='leaderboard')await renderLeaderboard(m);
    else if(state.tab==='dashboard')await renderDashboard(m);
    else if(state.tab==='regions')await renderRegions(m);
    else if(state.tab==='daily')await renderDaily(m);
    else if(state.tab==='gov')m.innerHTML=govHTML();
  }catch(e){m.innerHTML=`<div class="count">Could not load: ${e.message}</div>`;}
}

async function renderWorklist(m){
  const [wl,st]=await Promise.all([api('/api/worklist'),api('/api/stats')]);
  state.cases=wl.cases;
  const stages=[...new Set(wl.cases.map(c=>c.dropout_stage))];
  let rows=wl.cases.filter(c=>(state.priority==='ALL'||c.priority===state.priority)&&(state.stage==='ALL'||c.dropout_stage===state.stage));
  const myVillages=[...new Set(wl.cases.map(c=>c.village))];
  m.innerHTML=`
   <div class="regionbar">Your region: <b>${SESS.block||''}${SESS.district?', '+SESS.district:''}</b>
     &middot; ${myVillages.length} village${myVillages.length!==1?'s':''}: ${myVillages.join(', ')||'—'}</div>
   <div class="kpirow">
     <div class="kpi crit"><div class="n">${st.pending}</div><div class="l">To contact</div></div>
     <div class="kpi teal"><div class="n">${st.resolved}</div><div class="l">Resolved</div></div>
     <div class="kpi high"><div class="n">${st.unreachable}</div><div class="l">Unreachable</div></div>
     <div class="kpi gold"><div class="n">${st.points}</div><div class="l">Points &middot; ${st.tier}</div></div>
   </div>
   <div class="filters">
     <select onchange="state.priority=this.value;render()"><option value="ALL">All priorities</option><option>Critical</option><option>High</option></select>
     <select onchange="state.stage=this.value;render()"><option value="ALL">All stages</option>${stages.map(s=>`<option>${s}</option>`).join('')}</select>
   </div>
   <div class="count">${rows.length} patients &middot; ${SESS.block||SESS.district||'your region'} &middot; ${wl.date}</div>
   ${rows.map(caseHTML).join('')||'<div class="count">Nothing left — great work today.</div>'}`;
}

function caseHTML(c){
  const acted=c.status!=='pending';
  return `<div class="case ${c.priority} ${c.status}">
    <div class="crow">
      <div><div class="pid">${c.patient_ref}<span class="cadre ${c.assigned_cadre}">${c.assigned_cadre}</span></div>
        <div class="sub">${c.village}, ${c.district} &middot; ${c.age||''}${c.gender?'/'+c.gender:''} &middot; ${c.diagnosis_group||''}</div></div>
      <div>${priBadge(c.priority)}<div class="risk">${c.risk_pct}% risk</div></div>
    </div>
    <div class="action">&#9654; ${c.recommended_action}</div>
    <div class="why"><b>Why:</b> ${c.reason}</div>
    <div class="chips">
      <span class="chip">${c.dropout_stage}</span>
      <span class="chip">${c.distance_km} km</span>
      ${c.mobile_connectivity?`<span class="chip">${c.mobile_connectivity} signal</span>`:''}
      ${c.attempt_count>0?`<span class="chip">${c.attempt_count} attempt(s)</span>`:''}
    </div>
    ${acted?`<div style="margin-top:10px"><span class="statustag ${c.status}">${c.status.toUpperCase()}</span></div>`:
     `<div class="btnrow">
        <button class="b-resolve" onclick="act(${c.id},'resolved')">&#10003; Resolved</button>
        <button class="b-unreach" onclick="act(${c.id},'unreachable')">Unreachable</button>
        <button class="b-esc" onclick="act(${c.id},'escalate')">Escalate</button>
      </div>`}
  </div>`;
}

async function act(id,outcome){
  try{
    const r=await api('/api/action',{method:'POST',body:JSON.stringify({worklist_id:id,outcome})});
    if(outcome==='resolved')toast('Resolved · +'+r.points_awarded+' points');
    else if(outcome==='unreachable')toast('Marked unreachable · will reassign tonight');
    else toast('Escalated to CHO');
    render();
  }catch(e){toast(e.message);}
}

async function renderRewards(m){
  const [st,lb]=await Promise.all([api('/api/stats'),api('/api/leaderboard')]);
  const myRank=(lb.leaders.find(l=>l.name===SESS.name)||{}).rank;
  m.innerHTML=`
   <div class="bars" style="text-align:center">
     <div style="font-size:44px;font-weight:800;color:var(--gold)">${st.points}</div>
     <div class="hint" style="margin:2px 0 10px">total points</div>
     <span class="tier ${st.tier}">${st.tier} tier</span>
     ${myRank?`<div class="hint" style="margin-top:10px">Ranked #${myRank} among ASHA workers</div>`:''}
   </div>
   <div class="bars">
     <h3>Today's progress</h3>
     <div class="bar"><div class="lab">Resolved</div><div class="track"><div class="fill" style="width:${Math.max(6,st.progress)}%;background:var(--teal)">${st.resolved}/${st.total}</div></div></div>
     <div class="hint">You earn <b>10 points</b> for a resolved Critical case, <b>6</b> for High, plus a <b>+3 bonus</b> for reaching patients in far or weak-signal villages. Every contact attempt earns 1 point, so effort always counts.</div>
   </div>
   <div class="bars">
     <h3>Tiers</h3>
     <div class="detrow"><span class="k"><span class="tier Bronze">Bronze</span></span><span>0 – 49 points</span></div>
     <div class="detrow"><span class="k"><span class="tier Silver">Silver</span></span><span>50 – 119 points</span></div>
     <div class="detrow"><span class="k"><span class="tier Gold">Gold</span></span><span>120+ points</span></div>
     <div class="hint">Tiers and the leaderboard keep the follow-up work visible and rewarded, so the health workers who reach the hardest patients get recognised.</div>
   </div>`;
}

async function renderLeaderboard(m){
  const lb=await api('/api/leaderboard');
  m.innerHTML=`<div class="bars"><h3>ASHA leaderboard &middot; this cycle</h3>
    ${lb.leaders.map(l=>`<div class="lead ${l.name===SESS.name?'me':''}">
      <div class="rk ${l.rank<=3?'top':''}">${l.rank}</div>
      <div><div class="nm">${l.name}${l.name===SESS.name?' (you)':''}</div><div class="bl">${l.block}</div></div>
      <div style="flex:1"></div><span class="tier ${l.tier}" style="font-size:11px;padding:2px 8px">${l.tier}</span>
      <div class="pt">${l.pts}</div></div>`).join('')}
    <div class="hint">Points reward resolved follow-ups, weighted by how urgent and how hard-to-reach each patient is.</div></div>`;
}

async function renderDashboard(m){
  const [d,a]=await Promise.all([api('/api/supervisor/summary'),api('/api/supervisor/analytics')]);
  const barSet=(rows,val,lab,color)=>{
    const mx=Math.max(1,...rows.map(val));
    return rows.map(r=>`<div class="bar"><div class="lab">${lab(r)}</div>
      <div class="track"><div class="fill" style="width:${Math.max(7,val(r)/mx*100)}%;background:${color}">${val(r)}</div></div></div>`).join('');
  };
  m.innerHTML=`
   <div class="kpirow">
     <div class="kpi"><div class="n">${d.total}</div><div class="l">Cases today</div></div>
     <div class="kpi teal"><div class="n">${d.resolved}</div><div class="l">Resolved</div></div>
     <div class="kpi crit"><div class="n">${d.pending}</div><div class="l">Pending</div></div>
     <div class="kpi high"><div class="n">${d.stuck}</div><div class="l">Stuck / escalated</div></div>
     <div class="kpi"><div class="n">${d.resolution_rate}%</div><div class="l">Resolution rate</div></div>
   </div>
   <div class="grid2">
     <div class="bars"><h3>Cases by district</h3>
       ${barSet(a.by_district,r=>r.total,r=>r.district,'var(--accent)')}
       <div class="hint">Resolved so far: ${a.by_district.map(r=>r.district+' '+r.resolved).join(' · ')}</div></div>
     <div class="bars"><h3>Where patients drop out</h3>
       ${barSet(a.by_stage,r=>r.n,r=>r.stage,'var(--crit)')}
       <div class="hint">Medicine pickup is the biggest leak — the worklist leads with it.</div></div>
   </div>
   <div class="grid2">
     <div class="bars"><h3>Priority mix</h3>
       ${barSet(a.by_priority,r=>r.n,r=>r.priority,'var(--high)')}</div>
     <div class="bars"><h3>ASHA workload today</h3>
       ${barSet(a.workload,r=>r.n,r=>r.name+' · '+r.block,'var(--teal)')}
       <div class="hint">Balance the load by reassigning villages in the Regions tab.</div></div>
   </div>
   <div class="bars">
     <h3>Villages needing attention</h3>
     ${d.villages.slice(0,10).map(v=>`<div class="detrow"><span class="k">${v.village}, ${v.district}</span>
       <span>${v.resolved}/${v.total} done${v.stuck?` &middot; ${v.stuck} stuck`:''} &middot; ${v.avg_risk}% avg risk</span></div>`).join('')}
   </div>`;
}

let REGCACHE=null;
async function renderRegions(m){
  const d=await api('/api/supervisor/regions'); REGCACHE=d;
  const w=await api('/api/supervisor/workers');
  const ashaOpts=id=>d.ashas.map(a=>`<option value="${a.id}" ${''}>${a.name} · ${a.block}</option>`).join('');
  m.innerHTML=`
   <div class="bars">
     <h3>ASHA workers &amp; their coverage</h3>
     <div class="hint" style="margin-bottom:10px">Each worker, her villages, and today's load. This is the region-specific deployment.</div>
     ${w.workers.filter(x=>x.role==='ASHA').map(x=>`<div class="wrow">
        <div><div class="nm">${x.name} <span class="cadre ASHA">ASHA</span></div>
          <div class="sub">${x.block}, ${x.district} &middot; ${x.load_today} cases today &middot; ${x.points} pts</div>
          <div class="vils">${x.villages||'—'}</div></div>
        <button class="minibtn" onclick="dlReport(${x.id},'${x.name}')">Download report</button>
      </div>`).join('')}
   </div>
   <div class="bars">
     <h3>Reassign a village to a different ASHA</h3>
     <div class="hint" style="margin-bottom:10px">Move a village's pending cases to another worker (e.g. to balance load or cover leave).</div>
     <div class="rasrow">
       <select id="ras-village">${d.regions.map(r=>`<option value="${r.village}">${r.village} · ${r.block} (now: ${r.ashas||'unassigned'})</option>`).join('')}</select>
       <select id="ras-to">${d.ashas.map(a=>`<option value="${a.id}">${a.name} · ${a.block}</option>`).join('')}</select>
       <button class="minibtn-solid" onclick="doReassign()">Reassign</button>
     </div>
   </div>`;
}
async function dlReport(id,name){
  try{
    const r=await fetch('/api/supervisor/worker-report/'+id,{headers:{'Authorization':'Bearer '+SESS.token}});
    const blob=await r.blob(); const u=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=u; a.download=name+'_report.csv'; a.click(); URL.revokeObjectURL(u);
    toast('Downloaded '+name+"'s report");
  }catch(e){toast(e.message);}
}
async function doReassign(){
  const village=document.getElementById('ras-village').value;
  const to=parseInt(document.getElementById('ras-to').value);
  // find current owner from cache
  const reg=(REGCACHE.regions||[]).find(r=>r.village===village);
  try{
    const r=await api('/api/supervisor/reassign-village',{method:'POST',
      body:JSON.stringify({village,from_user_id:0,to_user_id:to})});
    toast('Moved '+r.moved+' case(s) in '+village);
    renderRegions(document.getElementById('main'));
  }catch(e){toast(e.message);}
}

async function renderDaily(m){
  const w=await api('/api/supervisor/workers');
  const active=w.workers.filter(x=>x.role==='ASHA'&&x.load_today>0);
  m.innerHTML=`
   <div class="bars">
     <h3>Step 1 · Collect end-of-day reports from workers</h3>
     <div class="hint" style="margin-bottom:10px">Download each ASHA's report (resolved, unreachable, escalated). Give unresolved patients to tomorrow's upload.</div>
     ${active.map(x=>`<div class="wrow">
        <div><div class="nm">${x.name}</div><div class="sub">${x.block} &middot; ${x.resolved_today}/${x.load_today} resolved today</div></div>
        <button class="minibtn" onclick="dlReport(${x.id},'${x.name}')">Download</button></div>`).join('')||'<div class="hint">No active workers today.</div>'}
   </div>
   <div class="bars">
     <h3>Step 2 · Upload tomorrow's worklist</h3>
     <div class="hint" style="margin-bottom:10px">Upload a CSV of patients to follow up. Each is auto-assigned to the ASHA covering that village. <a href="#" onclick="dlTemplate();return false;" style="color:var(--accent)">Download the template</a> first.</div>
     <div class="uprow">
       <input type="file" id="upfile" accept=".csv">
       <label class="sub">for date: <input type="date" id="update"></label>
       <button class="minibtn-solid" onclick="doUpload()">Upload &amp; assign</button>
     </div>
     <div id="upresult"></div>
   </div>
   <div class="bars">
     <h3>Step 3 · Auto-reassign unreachable patients</h3>
     <div class="hint" style="margin-bottom:10px">Hands every unreachable patient to a different worker for the next day, and escalates to a CHO after 3 failed attempts.</div>
     <button class="minibtn-solid" onclick="runNightly()">Run tonight's reassignment</button>
   </div>`;
}
function dlTemplate(){
  fetch('/api/supervisor/upload-template',{headers:{'Authorization':'Bearer '+SESS.token}})
    .then(r=>r.blob()).then(b=>{const u=URL.createObjectURL(b);const a=document.createElement('a');
      a.href=u;a.download='sahayalink_template.csv';a.click();URL.revokeObjectURL(u);});
}
async function doUpload(){
  const f=document.getElementById('upfile').files[0];
  if(!f){toast('Choose a CSV file first');return;}
  const fd=new FormData(); fd.append('file',f); fd.append('for_date',document.getElementById('update').value||'');
  try{
    const r=await fetch('/api/supervisor/upload',{method:'POST',
      headers:{'Authorization':'Bearer '+SESS.token},body:fd});
    const d=await r.json();
    if(!r.ok)throw new Error(d.detail||'Upload failed');
    document.getElementById('upresult').innerHTML=`<div class="okbox">Placed <b>${d.placed}</b> patients for <b>${d.for_date}</b>${d.skipped?`, skipped ${d.skipped} (village not recognised)`:''}.<br>
      ${d.assigned.map(a=>`${a.name} (${a.block}): ${a.cases}`).join(' · ')}</div>`;
    toast('Uploaded '+d.placed+' patients');
  }catch(e){toast(e.message);}
}
async function runNightly(){
  try{const r=await api('/api/admin/run-nightly',{method:'POST'});
    toast(`Reassigned ${r.reassigned}, escalated ${r.escalated} for ${r.for_date}`);
  }catch(e){toast(e.message);}
}

function govHTML(){return `
  <div class="bars gov"><h3>&#128272; Privacy &amp; minimum-necessary data</h3><ul>
    <li>Workers see a <b>masked patient reference</b>, village and the next action only &mdash; no clinical free-text or full identifiers.</li>
    <li>Phone numbers stay <b>masked</b>; calls go through the facility system.</li>
    <li>Aligned to <b>ABDM</b> principles. Data here is synthetic.</li></ul></div>
  <div class="bars gov"><h3>&#128100; Role-based access</h3><ul>
    <li><b>ASHA</b> sees only her assigned villages' worklist.</li>
    <li><b>CHO</b> sees clinical escalations, resupply and coverage.</li>
    <li><b>Supervisor</b> sees aggregates, never edits individual records.</li></ul></div>
  <div class="bars gov"><h3>&#128260; Follow-up that does not give up</h3><ul>
    <li>An unreachable patient is <b>reassigned to another worker</b> the next day.</li>
    <li>After <b>3 failed attempts</b> the case escalates to a CHO.</li>
    <li>Every attempt is logged &mdash; a full audit trail.</li></ul></div>
  <div class="bars gov"><h3>&#127942; Motivating the workforce</h3><ul>
    <li>Difficulty-weighted <b>points, tiers and a leaderboard</b> reward resolved follow-ups.</li>
    <li>Reaching hard, far, weak-signal patients earns a <b>bonus</b>, so effort where it is hardest is recognised.</li></ul></div>
  <div class="bars gov"><h3>&#9878; Fairness</h3><ul>
    <li>Risk uses <b>operational</b> signals (distance, stockout, pickup) &mdash; not caste, religion or income.</li>
    <li>Vulnerable patients route to <b>home visits</b>, and any clinical flag goes to a CHO.</li></ul></div>`;
}

function toggleTheme(){const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';}
document.getElementById('upin').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
